aid: localytics
name: Localytics
description: >-
  Localytics is a mobile analytics and customer-engagement platform that turns the behavioral
  signals a mobile app already produces into real-time analytics and personalized, data-driven
  campaigns across push notifications, in-app messages, and inbox messaging. It serves product,
  marketing, and engineering teams with segmentation, audience building, and campaign management.
  Its developer surface is broad but unevenly specified: two real OpenAPI 3.0.3 documents (a
  Campaigns & Audience API and a Transactional Push API served live at
  messaging.localytics.com/swagger.json), an MIT-licensed proto3 definition for a bidirectional
  streaming gRPC push service, and a published JSON Schema for Events API requests — alongside six
  further production REST APIs (Query/Reporting in HAL+JSON, Profile, Events, Exports, Imports,
  Places) that are documented only in prose. Everything authenticates with one organization-level
  API key and secret over HTTP Basic; there is no OAuth, no scopes and no rate-limit response
  headers anywhere. First-party SDKs cover iOS, Android, Web, Maui, Flutter, React Native, tvOS,
  Xamarin, Unity, Cordova and Windows. Localytics is an Upland Software product.
