aid: localytics
name: Localytics
description: >-
  Localytics is a mobile analytics and customer-engagement platform that turns the behavioral
  signals a mobile app already produces into real-time analytics and personalized, data-driven
  campaigns across push notifications, in-app messages, and inbox messaging. It serves product,
  marketing, and engineering teams with segmentation, audience building, and campaign management.
  For developers it exposes a set of HTTP REST APIs — a Query/Reporting API (HAL+JSON), a Push
  API for message delivery, and a Campaigns & Audience API (OpenAPI 3.0.3) for programmatic
  campaign and audience management — alongside first-party SDKs for Android, iOS, Apple TV, React
  Native, Web, and Windows. Added to the API Evangelist network as a portfolio lead and enriched
  from its live developer documentation.
