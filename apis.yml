- aid: localytics:localytics-query-api
  name: Localytics Query API
  description: >-
    HAL+JSON reporting and analytics API. Run queries over apps, events, sessions, users, profiles and
    attribution data with metrics, dimensions and conditions; the service root at https://api.localytics.com/v1
    returns application/vnd.localytics.v1+hal+json with templated _links. No machine-readable specification
    is published.
  humanURL: https://docs.localytics.com/dev/query-api.html
  baseURL: https://api.localytics.com/v1
  tags:
  - Analytics
  - Reporting
  - Query
  properties:
  - type: APIReference
    url: https://docs.localytics.com/dev/query-api.html
- aid: localytics:localytics-profile-api
  name: Localytics Profile API
  description: >-
    Read, create, update and delete user profile attributes used for targeting and segmentation, addressed
    by customer_id at the org, app or customer scope. No machine-readable specification is published.
  humanURL: https://docs.localytics.com/dev/profile-api.html
  baseURL: https://profile.localytics.com/v1
  tags:
  - Profiles
  - Customer Data
  properties:
  - type: APIReference
    url: https://docs.localytics.com/dev/profile-api.html
- aid: localytics:localytics-events-api
  name: Localytics Events API
  description: >-
    Server-side event ingestion for in-app activity that completes off-device (purchases, fulfilment,
    backend conversions). Accepts JSON or gzipped JSON up to 256 KB per POST, validated against a published
    versioned JSON Schema.
  humanURL: https://docs.localytics.com/dev/events-api.html
  baseURL: https://analytics.localytics.com/events/v1
  tags:
  - Event
  - Ingestion
  tags_raw:
  - Events
  - Ingestion
  properties:
  - type: APIReference
    url: https://docs.localytics.com/dev/events-api.html
  - type: JSONSchema
    url: json-schema/localytics-events-api-v1-schema.json
- aid: localytics:localytics-export-apis
  name: Localytics Export APIs
  description: >-
    Bulk export of audiences, profiles and raw analytics logs. Requests return a 302 redirect to a generated
    export file; audiences must be enabled for export in the dashboard first. No machine-readable specification
    is published.
  humanURL: https://docs.localytics.com/dev/export-apis.html
  baseURL: https://api.localytics.com/v1/exports
  tags:
  - Data Export
  - Audiences
  - Profiles
  properties:
  - type: APIReference
    url: https://docs.localytics.com/dev/export-apis.html
- aid: localytics:localytics-import-apis
  name: Localytics Import APIs
  description: >-
    Bulk import of user profiles and audience lists built in external systems (CRM, marketing cloud) into
    Localytics for targeting and campaign use, with an asynchronous status endpoint per import job. No
    machine-readable specification is published.
  humanURL: https://docs.localytics.com/dev/import-apis.html
  baseURL: https://api.localytics.com/v1/imports
  tags:
  - Data Import
  - Audiences
  - Profiles
  properties:
  - type: APIReference
    url: https://docs.localytics.com/dev/import-apis.html
- aid: localytics:localytics-places-api
  name: Localytics Places API
  description: >-
    Point-of-interest sync for location-triggered messaging — upload and manage the geofence/POI set an
    app monitors. Rate limited to 20 requests per hour and 50 per day per app. No machine-readable specification
    is published.
  humanURL: https://docs.localytics.com/dev/places-api.html
  baseURL: https://api.localytics.com/v1/places
  tags:
