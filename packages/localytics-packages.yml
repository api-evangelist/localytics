note: >-
  First-party Localytics client SDKs, resolved to real registry coordinates with the latest
  published version and its date. CocoaPods ownership is confirmed first-party
  (localytics.sdk@uplandsoftware.com — Localytics is an Upland Software product). Two historical
  npm packages published under the Localytics name are recorded with their real dates because
  their staleness is the finding: the JavaScript/React Native distribution moved off npm to the
  docs-hosted Web SDK loader and the localytics-react-native GitHub repo.
