note: >-
  Published rate limits across every documented Localytics API surface, read from the Limits /
  Rate Limits sections of each API reference page plus the gRPC push service client guide.
  Localytics documents the NUMBERS but publishes no rate-limit RESPONSE HEADERS on any surface —
  no X-RateLimit-*, no RateLimit-*, no Retry-After is documented, so a client cannot read its
  remaining budget at runtime and can only detect exhaustion from the status code.
limit_count: 17
exhaustion:
  http_status: 429
  grpc_status: RESOURCE_EXHAUSTED (8)
  headers_published: false
  retry_after: false
  detail: >-
    HTTP surfaces return 429 Too Many Requests with a descriptive message body. The gRPC push
    service returns RESOURCE_EXHAUSTED (8) for stream/message-size limits. No runtime budget
    header is documented on any surface.
