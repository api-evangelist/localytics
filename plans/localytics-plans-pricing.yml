metered_products:
  - name: Direct Access (Hosted)
    docs: https://docs.localytics.com/dev/directaccess.html
    unit: Snowflake credit
    detail: >-
      Customers purchase (or are granted) a quantity of warehouse hours at a warehouse size; the
      monthly quota is expressed in credits. A medium warehouse consumes 4 credits per hour
      (0.067 credits per minute), so 40 purchased hours is a 160-credit monthly quota. Warehouses
      bill by the minute with a 1-minute minimum, auto-suspend after 10 minutes of inactivity, and
      every query keeps the warehouse up for a minimum of 10 minutes.
    price_per_credit: null
    price_note: The credit consumption rate is published; the currency price of a credit is not.
  - name: Direct Access (Customer Hosted)
    docs: https://docs.localytics.com/dev/directaccess.html
    detail: >-
      Customers with their own Snowflake account may request access to their data inside that
      account, in which case compute is billed by Snowflake and not by Localytics.
