openapi: 3.2.0
info:
  title: Localytics Transactional Push Meta API
  version: 2.0.0
  description: Programmatic push messaging delivery.
servers:
- url: /
  description: This service
security:
- basicAuth: []
tags:
- name: Meta
  description: Health and documentation endpoints
paths:
  /:
    get:
      tags:
      - Meta
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
      operationId: getRoot
      x-operation-id-source: derived
  /v1/test:
    post:
      tags:
      - Meta
      summary: Liveness ping
      security: []
      responses:
        '200':
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
      operationId: postV1Test
      x-operation-id-source: derived
  /swagger.json:
    get:
      tags:
      - Meta
      summary: This OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI 3.0 JSON document
          content:
            application/json: {}
      operationId: getSwaggerJson
      x-operation-id-source: derived
  /docs:
    get:
      tags:
      - Meta
      summary: Interactive Swagger UI documentation
      security: []
      responses:
        '200':
          description: HTML page rendering Swagger UI against /swagger.json
          content:
            text/html: {}
      operationId: getDocs
      x-operation-id-source: derived
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic with `api_key:api_secret`.
