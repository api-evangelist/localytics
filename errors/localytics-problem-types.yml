gaps:
  - No machine-readable error-code registry; every table is prose HTML in the docs.
  - No stable error type URIs, no error codes beyond HTTP status, no RFC 9457 problem+json.
  - The Transactional Push API OpenAPI (messaging.localytics.com/swagger.json) defines an Error
    schema but no operationIds, so error responses cannot be bound to named operations.
